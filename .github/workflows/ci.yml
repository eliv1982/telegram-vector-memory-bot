name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Docling depends on PyTorch. On Linux, PyPI serves the CUDA build together with
      # several GB of nvidia-* packages that the offline test suite never uses. Installing
      # the CPU build first satisfies Docling's unpinned torch/torchvision requirements, so
      # the next step keeps it and does not pull the CUDA variant.
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install project with dev dependencies
        run: pip install -e ".[dev]"

      - name: Check dependency consistency
        run: pip check

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
